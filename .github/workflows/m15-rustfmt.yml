name: Format M15 Rust Source

on:
  push:
    branches: [feat/m15-developer-studio]
    paths:
      - '.github/workflows/m15-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m15-developer-studio
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          if git diff --cached --quiet; then
            echo "Rust source already formatted."
          else
            git commit -m "style(m15): apply cargo fmt"
            git push origin HEAD:feat/m15-developer-studio
          fi
