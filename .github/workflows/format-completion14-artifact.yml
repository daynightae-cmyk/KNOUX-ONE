name: Format Completion 14 Artifact

on:
  pull_request:
    paths:
      - 'src-tauri/src/completion14/**'
      - 'src-tauri/src/main.rs'
      - '.github/workflows/format-completion14-artifact.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: completion14-rustfmt-sources
          path: |
            src-tauri/src/completion14
            src-tauri/src/main.rs
          if-no-files-found: error
