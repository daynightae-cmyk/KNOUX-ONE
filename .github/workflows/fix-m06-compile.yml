name: Fix Module 06 Compile

on:
  pull_request:
    paths:
      - 'src-tauri/src/performance_center/**'
      - 'scripts/fix_m06_compile.py'
      - '.github/workflows/fix-m06-compile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact type repairs
        run: python scripts/fix_m06_compile.py
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit repair
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No compile repair required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/performance_center/mod.rs
          git commit -m 'fix(m06): satisfy typed operation result summaries'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
