name: Apply Module 08 Completion

on:
  pull_request:
    paths:
      - 'src-tauri/src/network_optimizer/**'
      - 'src/features/network/**'
      - 'src/data/capabilitiesCatalog.ts'
      - 'src/tests/**'
      - 'REAL_IMPLEMENTATION_MATRIX.md'
      - 'scripts/apply_m08_completion.py'
      - '.github/workflows/apply-m08-completion.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Module 08 completion patch
        run: python scripts/apply_m08_completion.py
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit deterministic changes
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No completion changes required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/capabilitiesCatalog.ts src/tests REAL_IMPLEMENTATION_MATRIX.md src-tauri/src/network_optimizer/mod.rs
          git commit -m 'feat(m08): finalize catalog evidence and formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
