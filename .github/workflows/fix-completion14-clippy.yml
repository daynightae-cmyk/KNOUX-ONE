name: Fix Completion 14 Clippy

on:
  pull_request:
    paths:
      - '.github/workflows/fix-completion14-clippy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact fixes
        shell: pwsh
        run: |
          $m02 = 'src-tauri/src/completion14/m02.rs'
          $text = Get-Content -Raw $m02
          $text = [regex]::Replace($text, '(?m)^\s*quarantine:\s*bool,\r?\n', '')
          $text = [regex]::Replace($text, '(?m)^\s*quarantine:\s*(?:true|false),\r?\n', '')
          Set-Content -NoNewline -Encoding UTF8 $m02 $text

          $m04 = 'src-tauri/src/completion14/m04.rs'
          $text = Get-Content -Raw $m04
          $text = $text.Replace('content.as_bytes().len()', 'content.len()')
          $text = [regex]::Replace($text, 'let\s+objects\s*=\s*vec!\[', 'let objects = [')
          Set-Content -NoNewline -Encoding UTF8 $m04 $text

          Push-Location src-tauri
          cargo fmt --all
          Pop-Location
      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/completion14/m02.rs src-tauri/src/completion14/m04.rs
          git commit -m 'fix(completion14): satisfy strict clippy gates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
