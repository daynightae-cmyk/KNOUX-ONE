name: Fix Module 07 Rust Bound

on:
  pull_request:
    paths:
      - 'src-tauri/src/windows_repair/**'
      - '.github/workflows/fix-m07-sized.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Relax serialization Sized bound
        shell: pwsh
        run: |
          $path = 'src-tauri/src/windows_repair/mod.rs'
          $text = [System.IO.File]::ReadAllText($path)
          $old = 'fn save_json<T: Serialize>(path: &Path, value: &T) -> Result<(), String> {'
          $new = 'fn save_json<T: Serialize + ?Sized>(path: &Path, value: &T) -> Result<(), String> {'
          if (-not $text.Contains($old) -and -not $text.Contains($new)) { throw 'save_json signature not found' }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit repair
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No repair required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/windows_repair/mod.rs
          git commit -m 'fix(m07): allow slice serialization in update history'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
