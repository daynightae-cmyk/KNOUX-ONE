name: Format Module 05 Artifact

on:
  pull_request:
    paths:
      - 'src-tauri/src/startup_services/**'
      - 'src/features/startup/**'
      - 'scripts/fix_m05_before_rustfmt.py'
      - '.github/workflows/format-m05-artifact.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply deterministic repairs
        run: python scripts/fix_m05_before_rustfmt.py
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit exact rustfmt output
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No formatting changes required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/startup_services/mod.rs src/features/startup/StartupServicesWorkspace.tsx
          git commit -m 'fix(m05): apply rustfmt and persistence safety fixes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: m05-rustfmt-sources
          path: |
            src-tauri/src/startup_services/mod.rs
            src/features/startup/StartupServicesWorkspace.tsx
          if-no-files-found: error
