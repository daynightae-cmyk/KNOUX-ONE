name: Format Module 06

on:
  pull_request:
    paths:
      - 'src-tauri/src/performance_center/**'
      - 'src-tauri/src/main.rs'
      - '.github/workflows/format-m06.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit exact rustfmt output
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No formatting changes required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/performance_center src-tauri/src/main.rs
          git commit -m 'style(m06): apply cargo fmt'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
