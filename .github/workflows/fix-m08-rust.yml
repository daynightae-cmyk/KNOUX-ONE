name: Fix Module 08 Rust Correctness

on:
  pull_request:
    paths:
      - 'src-tauri/src/network_optimizer/**'
      - 'scripts/fix_m08_rust.py'
      - '.github/workflows/fix-m08-rust.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply deterministic Rust correctness patch
        run: python scripts/fix_m08_rust.py
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit repair
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No repair required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/network_optimizer/mod.rs
          git commit -m 'fix(m08): correct error ownership and reset log creation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
