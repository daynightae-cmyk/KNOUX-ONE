name: Fix Module 08 Rust Correctness

on:
  pull_request:
    paths:
      - 'src-tauri/src/network_optimizer/**'
      - '.github/workflows/fix-m08-rust.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Rust ownership and log-directory fixes
        shell: pwsh
        run: |
          $path = 'src-tauri/src/network_optimizer/mod.rs'
          $text = [System.IO.File]::ReadAllText($path)
          $text = $text.Replace("        Some(message),`n", "        Some(message.clone()),`n")
          $old = @'
    let log_path = match app_root(&app) {
        Ok(root) => root
            .join("reset-logs")
            .join(format!("ip-reset-{}.log", Uuid::new_v4())),
        Err(error) => {
'@
          $new = @'
    let log_path = match app_root(&app).and_then(|root| {
        let directory = root.join("reset-logs");
        fs::create_dir_all(&directory)
            .map_err(|error| format!("reset_log_directory_failed:{error}"))?;
        Ok(directory.join(format!("ip-reset-{}.log", Uuid::new_v4())))
    }) {
        Ok(path) => path,
        Err(error) => {
'@
          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
          } elseif (-not $text.Contains('reset_log_directory_failed')) {
            throw 'stack reset log block not found'
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit repair
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No repair required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/network_optimizer/mod.rs
          git commit -m 'fix(m08): correct error ownership and reset log creation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
