name: Validate Module 03 Native Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/features/duplicates/**'
      - 'src/services/nativeClient.ts'
      - 'src/services/nativeCommandRegistry.ts'
      - 'src/services/operationService.ts'
      - 'src/data/capabilitiesCatalog.ts'
      - 'src/data/legacyCapabilitiesSeed.ts'
      - 'src/tests/**'
      - '.github/workflows/m03-native-validation.yml'
  push:
    branches: [feat/m03-real-duplicate-engine]

permissions:
  contents: write

jobs:
  rust:
    name: Rust format, check, clippy, and tests
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Apply verified quarantine cleanup hotfix
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("src-tauri/src/duplicates/quarantine.rs")
          source = path.read_text(encoding="utf-8")
          anchor = '''fn sync_file(path: &Path) -> Result<(), DuplicateError> {
              File::open(path)?
                  .sync_all()
                  .map_err(|error| DuplicateError::QuarantineCopyFailed(error.to_string()))
          }
          '''
          helper = anchor + '''
          fn remove_file_with_retry(path: &Path) -> Result<(), DuplicateError> {
              let mut last_error = None;
              for _ in 0..5 {
                  match fs::remove_file(path) {
                      Ok(()) => return Ok(()),
                      Err(error) if error.kind() == std::io::ErrorKind::NotFound => return Ok(()),
                      Err(error) => {
                          last_error = Some(error);
                          std::thread::sleep(std::time::Duration::from_millis(20));
                      }
                  }
              }
              Err(DuplicateError::QuarantineVerifyFailed(format!(
                  "failed_to_remove_unverified_copy:{}:{}",
                  path.display(),
                  last_error.map(|error| error.to_string()).unwrap_or_else(|| "unknown".into())
              )))
          }
          '''
          old = '''if full_blake3(destination)? != expected_hash {
              let _ = fs::remove_file(destination);
              return Err(DuplicateError::QuarantineVerifyFailed(
                  destination.display().to_string(),
              ));
          }'''
          new = '''if full_blake3(destination)? != expected_hash {
              remove_file_with_retry(destination)?;
              return Err(DuplicateError::QuarantineVerifyFailed(
                  destination.display().to_string(),
              ));
          }'''
          if "fn remove_file_with_retry" not in source:
              if anchor not in source:
                  raise SystemExit("quarantine helper anchor not found")
              source = source.replace(anchor, helper, 1)
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("quarantine verification block not found")
          path.write_text(source, encoding="utf-8")
          '@ | python -
          Push-Location src-tauri
          cargo fmt --all
          Pop-Location
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/duplicates/quarantine.rs
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix(m03): remove failed quarantine copies reliably"
            git push origin "HEAD:${{ github.head_ref }}"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: ${{ github.workspace }}
        run: npm install --no-audit --no-fund

      - name: Build frontend assets required by Tauri context
        working-directory: ${{ github.workspace }}
        run: npm run build

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify formatting
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../validation-logs | Out-Null
          cargo fmt --check 2>&1 | Tee-Object -FilePath ../validation-logs/cargo-fmt.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile native engine
        shell: pwsh
        run: |
          cargo check --all-targets --all-features 2>&1 | Tee-Object -FilePath ../validation-logs/cargo-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce Clippy
        shell: pwsh
        run: |
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | Tee-Object -FilePath ../validation-logs/cargo-clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native tests
        shell: pwsh
        run: |
          cargo test --all-features 2>&1 | Tee-Object -FilePath ../validation-logs/cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m03-native-validation-logs
          path: validation-logs
          if-no-files-found: warn
