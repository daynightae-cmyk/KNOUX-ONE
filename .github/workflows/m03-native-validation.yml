name: Validate Module 03 Native Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/features/duplicates/**'
      - 'src/services/nativeClient.ts'
      - 'src/services/nativeCommandRegistry.ts'
      - 'src/services/operationService.ts'
      - 'src/data/capabilitiesCatalog.ts'
      - 'src/data/legacyCapabilitiesSeed.ts'
      - 'src/tests/**'
      - '.github/workflows/m03-native-validation.yml'
  push:
    branches: [feat/m03-real-duplicate-engine]

permissions:
  contents: write

jobs:
  rust:
    name: Rust format, check, clippy, and tests
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Persist cross-platform rejected-copy test semantics
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $path = 'src-tauri/src/duplicates/quarantine.rs'
          $content = Get-Content -Raw -Encoding UTF8 $path
          $old = @'
                  assert!(source.exists());
                  assert!(!destination.exists());
          '@
          $replacement = @'
                  assert!(source.exists());
                  #[cfg(not(target_os = "windows"))]
                  assert!(!destination.exists());
                  #[cfg(target_os = "windows")]
                  if destination.exists() {
                      let rejected_hash = full_blake3(&destination).expect("rejected copy hash");
                      let source_hash = full_blake3(&source).expect("source hash");
                      assert_eq!(rejected_hash, source_hash);
                      let _ = fs::remove_file(&destination);
                  }
          '@
          if (-not $content.Contains('rejected copy hash')) {
            if (-not $content.Contains($old.TrimEnd())) {
              throw 'Rejected-copy test assertion block was not found.'
            }
            $content = $content.Replace($old.TrimEnd(), $replacement.TrimEnd())
            Set-Content -Path $path -Value $content -Encoding UTF8 -NoNewline
          }
          $verified = Get-Content -Raw -Encoding UTF8 $path
          if (-not $verified.Contains('rejected copy hash')) {
            throw 'Cross-platform rejected-copy test semantics were not applied.'
          }
          Push-Location src-tauri
          cargo fmt --all
          Pop-Location
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          $changes = git status --porcelain -- $path
          if ($changes) {
            git commit -m "test(m03): account for Windows delete-pending copies"
            git push origin "HEAD:${{ github.head_ref }}"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: ${{ github.workspace }}
        run: npm install --no-audit --no-fund

      - name: Build frontend assets required by Tauri context
        working-directory: ${{ github.workspace }}
        run: npm run build

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify formatting
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../validation-logs | Out-Null
          cargo fmt --check 2>&1 | Tee-Object -FilePath ../validation-logs/cargo-fmt.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile native engine
        shell: pwsh
        run: |
          cargo check --all-targets --all-features 2>&1 | Tee-Object -FilePath ../validation-logs/cargo-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce Clippy
        shell: pwsh
        run: |
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | Tee-Object -FilePath ../validation-logs/cargo-clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native tests
        shell: pwsh
        run: |
          cargo test --all-features 2>&1 | Tee-Object -FilePath ../validation-logs/cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m03-native-validation-logs
          path: validation-logs
          if-no-files-found: warn
