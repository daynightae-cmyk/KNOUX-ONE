name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knoux-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Signed Windows release
    if: >-
      github.repository == 'daynightae-cmyk/KNOUX-ONE' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    runs-on: windows-latest
    timeout-minutes: 90
    environment: ${{ contains(github.ref_name, '-beta.') && 'beta' || 'production' }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}

    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache locked Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows

      - name: Verify release identity and signing prerequisites
        id: release_metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ($tag -ne "v$version") {
            throw "[release] tag $tag does not match package version v$version."
          }

          $channel = if ($version -match '-beta\.') { 'beta' } elseif ($version -match '-') {
            throw "[release] prerelease versions must use the beta.N suffix."
          } else { 'stable' }

          $versionMatch = [regex]::Match($version, '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)(?:-beta\.(?<beta>0|[1-9]\d*))?$')
          if (-not $versionMatch.Success) {
            throw '[release] version must be stable X.Y.Z or beta X.Y.Z-beta.N.'
          }

          $candidate = [pscustomobject]@{
            Major = [int]$versionMatch.Groups['major'].Value
            Minor = [int]$versionMatch.Groups['minor'].Value
            Patch = [int]$versionMatch.Groups['patch'].Value
            Beta = if ($versionMatch.Groups['beta'].Success) { [int]$versionMatch.Groups['beta'].Value } else { $null }
          }
          $published = @(gh release list --limit 100 --json tagName,isPrerelease,isDraft | ConvertFrom-Json)
          $stableReleases = @(
            $published |
              Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object {
                $parts = $_.tagName.TrimStart('v').Split('.')
                [pscustomobject]@{ Major = [int]$parts[0]; Minor = [int]$parts[1]; Patch = [int]$parts[2]; Tag = $_.tagName }
              } |
              Sort-Object Major, Minor, Patch -Descending
          )

          if ($stableReleases.Count -gt 0) {
            $latestStable = $stableReleases[0]
            $isNextPatch = $candidate.Major -eq $latestStable.Major -and $candidate.Minor -eq $latestStable.Minor -and $candidate.Patch -gt $latestStable.Patch
            if (-not $isNextPatch) {
              throw "[release] Patch-only rollback policy requires a version above $($latestStable.Tag) in the same major.minor line."
            }
          }

          if ($channel -eq 'beta') {
            $betaReleases = @(
              $published |
                Where-Object { -not $_.isDraft -and $_.isPrerelease -and $_.tagName -match "^v$($candidate.Major)\.$($candidate.Minor)\.$($candidate.Patch)-beta\.(?<number>0|[1-9]\d*)$" } |
                ForEach-Object { [int]([regex]::Match($_.tagName, '-beta\.(?<number>0|[1-9]\d*)$').Groups['number'].Value) } |
                Sort-Object -Descending
            )
            if ($betaReleases.Count -gt 0 -and $candidate.Beta -le $betaReleases[0]) {
              throw "[release] Beta rollback policy requires beta.N above beta.$($betaReleases[0]) for this patch line."
            }
          }

          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw '[release] TAURI_SIGNING_PRIVATE_KEY is required; unsigned updater artifacts are prohibited.'
          }

          $tauriConfig = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($tauriConfig.plugins.updater.pubkey -eq 'PLACEHOLDER_OWNER_MUST_GENERATE_KEY') {
            throw '[release] src-tauri/tauri.conf.json still contains the updater public-key placeholder.'
          }

          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          $hasAzure = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TENANT_ID,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Measure-Object | Select-Object -ExpandProperty Count

          if ($hasPfx -and $hasAzure -gt 0) {
            throw '[release] Configure exactly one Authenticode mode: PFX or Azure Trusted Signing, never both.'
          }

          if (-not $hasPfx -and $hasAzure -ne 6) {
            throw '[release] Configure WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD, or all six Azure Trusted Signing values.'
          }

          if ($hasPfx) {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
              throw '[release] WINDOWS_TIMESTAMP_URL is required for timestamped PFX Authenticode signing.'
            }

            $timestampUri = [Uri]$env:WINDOWS_TIMESTAMP_URL
            if ($timestampUri.Scheme -ne 'https') {
              throw '[release] WINDOWS_TIMESTAMP_URL must use HTTPS.'
            }

            $signingMode = 'pfx'
          } else {
            $azureEndpoint = [Uri]$env:AZURE_TRUSTED_SIGNING_ENDPOINT
            if ($azureEndpoint.Scheme -ne 'https') {
              throw '[release] AZURE_TRUSTED_SIGNING_ENDPOINT must use HTTPS.'
            }

            $signingMode = 'azure'
          }

          "channel=$channel" >> $env:GITHUB_OUTPUT
          "signing_mode=$signingMode" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify version parity from the release tag
        run: bun run release:verify-version -- --require-tag

      - name: Verify source quality before signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun run services:check
          bun run typecheck
          bun run test
          bun run build
          Push-Location src-tauri
          cargo fmt --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          Pop-Location

      - name: Configure PFX Authenticode signing
        if: steps.release_metadata.outputs.signing_mode == 'pfx'
        id: pfx_signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'knoux-one-release-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

          if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
            throw '[release] PFX import did not expose a signing certificate thumbprint.'
          }

          $configuration = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 6 -Compress
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri.windows.signing.json'
          [System.IO.File]::WriteAllText($configPath, $configuration, [System.Text.UTF8Encoding]::new($false))
          "config_path=$configPath" >> $env:GITHUB_OUTPUT

      - name: Configure Azure Trusted Signing
        if: steps.release_metadata.outputs.signing_mode == 'azure'
        id: azure_signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo install artifact-signing-cli --locked
          $signCommand = 'artifact-signing-cli -e "{0}" -a "{1}" -c "{2}" -d "KNOUX ONE" "%1"' -f $env:AZURE_TRUSTED_SIGNING_ENDPOINT, $env:AZURE_TRUSTED_SIGNING_ACCOUNT, $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE
          $configuration = @{
            bundle = @{
              windows = @{
                signCommand = $signCommand
              }
            }
          } | ConvertTo-Json -Depth 6 -Compress
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri.windows.signing.json'
          [System.IO.File]::WriteAllText($configPath, $configuration, [System.Text.UTF8Encoding]::new($false))
          "config_path=$configPath" >> $env:GITHUB_OUTPUT

      - name: Build signed installers and signed updater artifacts
        shell: pwsh
        env:
          CHANNEL: ${{ steps.release_metadata.outputs.channel }}
          SIGNING_CONFIG: ${{ steps.pfx_signing.outputs.config_path || steps.azure_signing.outputs.config_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:SIGNING_CONFIG -PathType Leaf)) {
            throw '[release] Signing configuration was not generated.'
          }

          bun run desktop:build -- --bundles nsis,msi --config $env:SIGNING_CONFIG --config "src-tauri/tauri.$env:CHANNEL.conf.json"

      - name: Stage exact signed installer outputs
        id: staged_artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'release'
          Remove-Item -LiteralPath $releaseDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $releaseDirectory | Out-Null

          $nsis = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          $msi = @(Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "[release] Expected exactly one NSIS .exe and one MSI .msi, found NSIS=$($nsis.Count) MSI=$($msi.Count)."
          }

          foreach ($installer in @($nsis[0], $msi[0])) {
            $signature = "$($installer.FullName).sig"
            if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) {
              throw "[release] Missing Tauri updater signature for $($installer.Name)."
            }

            Copy-Item -LiteralPath $installer.FullName -Destination $releaseDirectory
            Copy-Item -LiteralPath $signature -Destination $releaseDirectory
          }

          "release_directory=$releaseDirectory" >> $env:GITHUB_OUTPUT
          "nsis_name=$($nsis[0].Name)" >> $env:GITHUB_OUTPUT

      - name: Verify Authenticode and emit SHA-256 sums
        shell: pwsh
        env:
          RELEASE_DIRECTORY: ${{ steps.staged_artifacts.outputs.release_directory }}
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-signatures.ps1 -ArtifactsDirectory $env:RELEASE_DIRECTORY

      - name: Generate SPDX SBOM for the release payload
        uses: anchore/sbom-action@v0
        with:
          path: release
          format: spdx-json
          output-file: release/KNOUX-ONE.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Preserve signed release evidence
        uses: actions/upload-artifact@v4
        with:
          name: knoux-one-${{ github.ref_name }}-windows-release-evidence
          path: release
          if-no-files-found: error
          retention-days: 30

      - name: Attest signed installer provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.exe
            release/*.msi

      - name: Attest signed installer SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.exe
            release/*.msi
          sbom-path: release/KNOUX-ONE.spdx.json

      - name: Create versioned draft release
        shell: pwsh
        env:
          CHANNEL: ${{ steps.release_metadata.outputs.channel }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "[release] A release already exists for $env:TAG. Tags must produce exactly one release."
          }

          $arguments = @('release', 'create', $env:TAG, '--draft', '--verify-tag', '--generate-notes')
          if ($env:CHANNEL -eq 'beta') {
            $arguments += @('--prerelease', '--latest=false')
          }
          gh @arguments

      - name: Upload signed installers, updater signatures, checksums, and SBOM
        shell: pwsh
        env:
          RELEASE_DIRECTORY: ${{ steps.staged_artifacts.outputs.release_directory }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -LiteralPath $env:RELEASE_DIRECTORY -File | Where-Object { $_.Name -ne 'latest.json' } | Sort-Object Name
          if ($files.Count -lt 6) {
            throw '[release] Expected installers, Tauri signatures, SHA256SUMS, and SBOM before any manifest publication.'
          }
          gh release upload $env:TAG @($files.FullName) --clobber

      - name: Generate channel manifest from the signed NSIS updater signature
        shell: pwsh
        env:
          CHANNEL: ${{ steps.release_metadata.outputs.channel }}
          NSIS_NAME: ${{ steps.staged_artifacts.outputs.nsis_name }}
          RELEASE_DIRECTORY: ${{ steps.staged_artifacts.outputs.release_directory }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RELEASE_DIRECTORY $env:NSIS_NAME
          $signature = "$installer.sig"
          $encodedName = [System.Uri]::EscapeDataString($env:NSIS_NAME)
          $artifactUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$encodedName"
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          $manifest = Join-Path $env:RELEASE_DIRECTORY 'latest.json'

          bun run release:create-update-manifest -- --channel $env:CHANNEL --version $env:VERSION --artifact $installer --signature $signature --artifact-url $artifactUrl --pub-date $publishedAt --output $manifest
          $parsed = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($parsed.version -ne $env:VERSION -or $parsed.platforms.'windows-x86_64'.url -ne $artifactUrl) {
            throw '[release] Generated update manifest did not round-trip to the signed NSIS artifact.'
          }

      - name: Publish stable manifest last
        if: steps.release_metadata.outputs.channel == 'stable'
        shell: pwsh
        env:
          RELEASE_DIRECTORY: ${{ steps.staged_artifacts.outputs.release_directory }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release upload $env:TAG (Join-Path $env:RELEASE_DIRECTORY 'latest.json') --clobber
          gh release edit $env:TAG --draft=false --latest

      - name: Publish beta manifest last
        if: steps.release_metadata.outputs.channel == 'beta'
        shell: pwsh
        env:
          RELEASE_DIRECTORY: ${{ steps.staged_artifacts.outputs.release_directory }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:RELEASE_DIRECTORY 'latest.json'
          gh release edit $env:TAG --draft=false --prerelease --latest=false
          gh release view beta 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload beta $manifest --clobber
          } else {
            gh release create beta $manifest --target $env:GITHUB_SHA --title 'KNOUX ONE Beta Update Channel' --notes 'Mutable signed updater manifest for beta builds only.' --prerelease --latest=false
          }
