name: Validate KNOUX Workspace

on:
  push:
    branches:
      - feat/premium-workspace-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Capture typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          echo "$code" > typecheck.exit
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: |
            typecheck.log
            typecheck.exit
          if-no-files-found: error

      - name: Enforce typecheck
        shell: bash
        run: |
          cat typecheck.log
          test "$(cat typecheck.exit)" = "0"

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
