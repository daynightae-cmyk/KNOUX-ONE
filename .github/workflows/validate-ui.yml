name: Validate KNOUX Workspace

on:
  push:
    branches:
      - feat/premium-workspace-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify service reality
        run: bun run services:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
