name: Validate KNOUX Workspace

on:
  push:
    branches:
      - feat/premium-workspace-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
