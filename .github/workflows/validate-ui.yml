name: Validate KNOUX Workspace

on:
  push:
    branches:
      - feat/premium-workspace-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Typecheck
        shell: bash
        run: |
          npm run typecheck > typecheck.log 2>&1 || {
            echo "::group::TypeScript errors"
            tail -n 120 typecheck.log
            echo "::endgroup::"
            exit 1
          }
          cat typecheck.log

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
