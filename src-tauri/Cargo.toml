[package]
name = "knoux-one"
version = "1.0.0"
description = "KNOUX ONE — Windows Intelligence & Developer Suite"
authors = ["Eng. Sadek Elgazar (Knoux)"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
